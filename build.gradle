plugins {
    id 'fabric-loom' version '1.1-SNAPSHOT'
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

extraProperties {
    properties {
        minecraft_version = project.minecraft_version
        loader_version = project.loader_version
        mod_version = project.mod_version
        maven_group = project.maven_group
        archives_base_name = project.archives_base_name
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${minecraft_version}+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${loader_version}+1.0.9"
}

processResources {
    inputs.property "version", project.mod_version
}

loom {
    refreshVersions = true
    refreshDeps = true
}